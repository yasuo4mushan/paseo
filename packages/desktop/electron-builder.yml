npmRebuild: false
# aaswitch is the user-facing brand (t14); the npm scope and the `aaswitch`
# binary follow it (t33). The `paseo://` deep-link scheme intentionally stays
# Paseo-based.
appId: cn.aaswitch.desktop
productName: aaswitch
executableName: aaswitch
protocols:
  - name: aaswitch agent link
    schemes:
      - paseo
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@aaswitch/*/src/**"
  - "!node_modules/@aaswitch/**/*.test.*"
  - "!node_modules/@aaswitch/**/*.spec.*"
  - "!node_modules/@aaswitch/server/dist/server/web-ui/**"
  - "!node_modules/@aaswitch/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  # The CLI publishes as the bare `aaswitch` package, so it needs its own
  # exclusions outside the @aaswitch scope globs.
  - "!node_modules/@aaswitch/*/.debug/**"
  - "!node_modules/@aaswitch/*/.tasks/**"
  - "!node_modules/@aaswitch/*/conversations/**"
  - "!node_modules/@aaswitch/*/test-results/**"
  - "!node_modules/aaswitch/src/**"
  - "!node_modules/aaswitch/**/*.test.*"
  - "!node_modules/aaswitch/**/*.spec.*"
  - "!node_modules/aaswitch/.debug/**"
  - "!node_modules/aaswitch/.tasks/**"
  - "!node_modules/aaswitch/conversations/**"
  - "!node_modules/aaswitch/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@aaswitch/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: getpaseo
  repo: paseo
mac:
  artifactName: "aaswitch-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/aaswitch
      to: bin/aaswitch
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "aaswitch-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "aaswitch"
  extraResources:
    - from: bin/aaswitch
      to: bin/aaswitch
    - from: assets/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=aaswitch"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/aaswitch CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "aaswitch-${arch}.${ext}"
win:
  artifactName: "aaswitch-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/aaswitch.cmd
      to: bin/aaswitch.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
