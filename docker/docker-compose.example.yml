# Minimal aaswitch daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change AASWITCH_PASSWORD first.
services:
  aaswitch:
    image: ghcr.io/aaswitch/aaswitch:latest
    container_name: aaswitch
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      AASWITCH_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # AASWITCH_HOSTNAMES: "aaswitch.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./aaswitch-home:/home/aaswitch
      # Code visible to aaswitch and the agents it launches.
      - ./workspace:/workspace
